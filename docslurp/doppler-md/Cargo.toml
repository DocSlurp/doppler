[package]
name = "doppler-md"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Markdown from DocSlurp doppler `pdftotext -bbox-layout -wordmeta -rules` XHTML (port of doppler_md.py)"
license = "GPL-2.0-or-later"
publish = false

[lib]
name = "doppler_md"
path = "src/lib.rs"

[[bin]]
name = "doppler-md"
path = "src/main.rs"

[[bin]]
name = "pdftomarkdown"
path = "src/bin/pdftomarkdown.rs"

[dependencies]
memchr = "2"
serde_json = "1"
# image extraction (`pdftomarkdown --images-dir`); all build statically (see README)
# libwebp (bundled C source, compiled with cc) behind a safe API: lossy and lossless WebP
webp = { version = "0.3", default-features = false }
png = "0.18"
crc32fast = "1"
roxmltree = "0.21"
sha2 = "0.11"
rustix = { version = "1", features = ["fs", "param", "process", "stdio"] }

[dev-dependencies]
# the original patterns, to check the hand-written matchers in src/patterns.rs
regex = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
